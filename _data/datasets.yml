  overview: |
    WindsorML comprises 355 geometric variants of the Windsor body, each evaluated using a GPU-native, wall-modelled large-eddy simulation. Its geometric complexity lies between the simplified Ahmed body and a complete road-car configuration.

    The simulations use a Cartesian immersed-boundary approach with approximately 300 million cells per case. The repository provides geometry, three-dimensional surface and volume fields, force and moment coefficients and rendered views in standard scientific data formats. Native-point dual-area arrays accompany all 350 currently available boundary VTUs for physically area-weighted surface metrics.

    Official deterministic train, validation and test splits are provided for a random baseline, nested data-efficiency studies, geometry extrapolation, drag-regime extrapolation and image-derived wake evaluation.
  intended_uses:
    - Surrogate modelling of automotive aerodynamic quantities.
    - Comparison of learning behaviour across levels of geometric and flow complexity.
    - Prediction of surface fields, volume fields or integrated force targets.
    - Analysis of separated road-vehicle-like wakes across a consistent simulation set.
    - Area-weighted evaluation of predictions on the native boundary points.
  outputs:
    - name: Geometry
      details: "Parametric definitions plus tessellated and CAD surfaces"
      formats: "CSV · STL · STEP"
    - name: Surface fields
      details: "Time-averaged boundary flow quantities"
      formats: VTU
    - name: Surface quadrature
      details: "Barycentric dual-area weights aligned with native boundary points"
      formats: NPY
    - name: Volume fields
      details: "Three-dimensional time-averaged solution fields"
      formats: VTU
    - name: Integrated data
      details: "Drag, side force, lift and pitching moment coefficients"
      formats: CSV
    - name: Derived views
      details: "Geometry and flow-field images across multiple planes"
      formats: PNG
    - name: Official benchmark splits
      details: "Deterministic case lists, split-construction metrics, scripts and methodology"
      formats: "JSON · CSV · Python · PDF"
  surface_quadrature:
    title: "Native-point surface dual areas"
    summary: "Each sidecar contains one little-endian float32 barycentric dual-area weight in square metres per native boundary point, in the exact point order of the corresponding raw VTU."
    association: "PointData · native points"
    coverage: "350/350 available boundary cases"
    units: "m²"
    payload_size: "3.17 GB"
    filename_pattern: "run_N/boundary_dual_area_N.npy"
    compatibility_note: "The arrays cover runs 0–349. Runs 350–354 do not currently have public boundary VTUs or area sidecars. Each available array is valid only for its exact raw boundary_N.vtu and native point order."
    files_url: https://huggingface.co/datasets/neashton/windsorml/tree/main/surface_dual_areas
    manifest_url: https://huggingface.co/datasets/neashton/windsorml/resolve/main/surface_dual_areas/manifest.json
  official_splits:
    release_date: "2026-08-17"
    summary: "Eight deterministic split regimes are provided for standard benchmarking, data-efficiency studies and out-of-distribution evaluation. The committed JSON manifest is the source of truth for case membership."
    public_cases: 355
