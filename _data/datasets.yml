- key: hiliftaeroml
  name: HiLiftAeroML
  short_name: HiLiftAeroML
  permalink: /hiliftaeroml/
  seo_title: "HiLiftAeroML: high-lift aircraft CFD dataset for machine learning"
  description: "HiLiftAeroML comprises 1,800 WMLES cases of NASA CRM-HL aircraft variants for aerodynamic machine-learning research."
  eyebrow: "Aerospace · high-lift aerodynamics"
  tagline: "1,800 WMLES cases spanning 180 NASA CRM-HL variants and ten angles of attack."
  image: /assets/img/datasets/hiliftaeroml-wss.webp
  image_alt: "Wall-shear-stress rendering of a HiLiftAeroML CRM-HL aircraft case"
  image_credit: "Representative wall-shear-stress rendering from the HiLiftAeroML repository, CC BY 4.0."
  domain: Aerospace
  geometry: "NASA CRM-HL"
  cases: "1,800 cases"
  case_count: 1800
  flow_regime: "Angles of attack from 4° to 22°"
  method: "Explicit WMLES"
  solver: "Fidelity Charles"
  resolution: "300–500 million cells per case"
  size: "About 66.9 TB stored"
  license: "CC BY 4.0"
  license_url: https://creativecommons.org/licenses/by/4.0/
  repository: nvidia/HiLiftAeroML
  huggingface_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML
  paper_url: https://arxiv.org/abs/2605.19565
  paper_title: "HiLiftAeroML: High-Fidelity Computational Fluid Dynamics Dataset for High-Lift Aircraft Aerodynamics"
  arxiv_id: "2605.19565"
  published: "2026-05-20"
  modified: "2026-09-02"
  formats: [VTU, NPY, STL, STEP, CSV, PNG, JSON]
  keywords:
    [
      computational fluid dynamics,
      machine learning,
      aircraft aerodynamics,
      high lift,
      CRM-HL,
      WMLES,
      scientific machine learning,
      surface quadrature,
      area-weighted evaluation,
    ]
  overview: |
    HiLiftAeroML comprises 1,800 simulations: 180 variants of the NASA Common Research Model in high-lift configuration, each evaluated at ten angles of attack from 4° to 22°. The dataset supports surrogate modelling of complex three-dimensional aircraft flows.

    The simulations use GPU-accelerated explicit wall-modelled LES on solution-adapted grids containing 300–500 million cells. In addition to geometry, surface and volume fields and integrated coefficients, the repository provides deterministic training, validation and test splits and native-surface quadrature weights for reproducible, area-weighted evaluation.

    Six force/moment records now use mean coefficients integrated from the released time-averaged surface fields, resolving discrepancies with the original solver-monitor means. The repository also publishes row-level metadata for invalid zero-filled entries in the native volume fields.
  intended_uses:
    - Surrogate modelling of complete aircraft in high-lift configuration.
    - Evaluation of interpolation and out-of-distribution generalisation.
    - Assessment on unseen geometries, angles of attack, deflections and stall conditions.
    - Area-weighted evaluation of native-surface predictions.
  outputs:
    - name: Geometry
      details: "Tessellated and CAD definitions for each aircraft variant"
      formats: "STL · STEP"
    - name: Surface fields
      details: "Compressed time-averaged boundary data"
      formats: VTU.TGZ
    - name: Surface quadrature
      details: "Barycentric dual-area weights aligned with native boundary points"
      formats: NPY
    - name: Volume fields
      details: "Compressed three-dimensional time-averaged solution"
      formats: VTU.TGZ
    - name: Integrated data
      details: "Forces, moments, geometry values and flow reference values"
      formats: CSV
    - name: Evaluation assets
      details: "Deterministic split families, manifests, validation records and plots"
      formats: "JSON · CSV · PNG"
    - name: Data-quality metadata
      details: "Force/moment override provenance and native-volume zero-fill row IDs"
      formats: "JSON · JSONL · CSV"
  force_moment_overrides:
    title: "Surface-integrated force/moment overrides"
    release_date: "2 September 2026"
    summary: "For six cases, the published mean force and moment coefficients were replaced with values obtained by canonical integration of the released time-averaged surface pressure and wall-shear fields. The remaining 1,794 cases retain their original solver-monitor means."
    cases:
      - geo_LHC012_AoA_16
      - geo_LHC018_AoA_16
      - geo_LHC028_AoA_18
      - geo_LHC028_AoA_22
      - geo_LHC129_AoA_4
      - geo_LHC172_AoA_22
    changed_columns: [cd, cl, cm, clp, clv, cdp, cdv]
    unchanged_columns: [cd_stdev, cl_stdev, cm_stdev, cd_stderr, cl_stderr, cm_stderr, cd_ci95, cl_ci95, cm_ci95]
    method: "Forces use exact degree-one integration on the ordered fan triangulation. Pitching moment uses exact degree-two integration about the per-case forcesCoR, with qRef, areaRef and chordRef taken from the corresponding reference CSV."
    redownload: "If you downloaded the dataset before 2 September 2026, retrieve the six affected per-case force_mom CSV files again, together with the root force_mom_all.csv summary."
    caution: "The existing standard-deviation, standard-error and 95% confidence-interval columns, together with the CD, CL and CM convergence plots, remain solver-monitor diagnostics. They were not recomputed and are not uncertainty estimates for the substituted surface-integrated means."
    manifest_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML/blob/main/force_mom_surface_overrides_v1.json
  surface_quadrature:
    title: "Native-point surface dual areas"
    summary: "Each sidecar contains one little-endian float32 barycentric dual-area weight in square inches per native boundary point, in the exact point order of the corresponding raw VTU."
    association: "PointData · native points"
    coverage: "1,800/1,800 cases"
    units: "in²"
    payload_size: "1.02 TB"
    filename_pattern: "geo_LHCi_AoA_j/boundary_dual_area_geo_LHCi_AoA_j.npy"
    compatibility_note: "Each array is valid only for its corresponding raw boundary VTU and native point order. It must not be applied to an STL, resampled mesh, reordered points or a processed PhysicsNeMo representation."
    files_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML/tree/main/surface_dual_areas
    manifest_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML/resolve/main/surface_dual_areas/manifest.json
  volume_data_quality:
    title: "Native-volume zero-fill rows"
    summary: "Across 419,416,158,837 native volume rows, 1,232,817 rows contain exact zeros in every exported flow and statistics field. The affected rows occur in 1,768 of the 1,800 cases and do not contain physically valid CFD solution states; omit them when using the released volume fields."
    association: "PointData · native volume rows"
    affected_cases: "1,768/1,800 cases"
    affected_rows: "1,232,817/419,416,158,837 rows"
    identification: "Zero-based raw VTU row IDs selected by exact stored Float32 avg(P) == 0.0, then verified to be zero in every exported field."
    compatibility_note: "Use the exact (case_id, raw_point_id) pair to omit rows from the corresponding native volume VTU. Coordinates are diagnostic only; do not use coordinate rounding, nearest-neighbour matching or a geometric tolerance to redefine row identity."
    files_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML/tree/main/data_quality
    manifest_url: https://huggingface.co/datasets/nvidia/HiLiftAeroML/blob/main/data_quality/volume_zero_fill_raw_point_ids_all1800_manifest.json
  download_groups:
    - id: summary
      label: Summary and splits
      description: "All-case tables, force/moment override provenance and deterministic splits."
      default: true
      patterns: [force_mom_all.csv, force_mom_surface_overrides_v1.json, geo_values_all.csv, "splits/**"]
    - id: metadata
      label: Per-case metadata
      description: "Force, geometry and reference CSV files."
      default: true
      patterns: ["geo_LHC*_AoA_*/force_mom_*.csv", "geo_LHC*_AoA_*/geo_values_*.csv", "geo_LHC*_AoA_*/ref_values_*.csv"]
    - id: geometry
      label: Geometry
      description: "Per-case STL and STEP geometry."
      default: false
      patterns: ["geo_LHC*_AoA_*/*.stl", "geo_LHC*_AoA_*/*.stp"]
    - id: images
      label: Images and plots
      description: "Wall-shear-stress renders and coefficient histories."
      default: false
      patterns: ["geo_LHC*_AoA_*/*.png"]
    - id: quadrature
      label: Surface quadrature
      description: "Native-point dual-area weights and their provenance."
      default: false
      patterns: ["geo_LHC*_AoA_*/boundary_dual_area_*.npy", "surface_dual_areas/**"]
    - id: quality
      label: Volume data quality
      description: "Invalid zero-fill row IDs, coordinates, provenance and checksums."
      default: true
      patterns: ["data_quality/**"]
    - id: fields
      label: Surface and volume fields
      description: "The largest compressed CFD archives."
      default: false
      patterns: ["geo_LHC*_AoA_*/boundary_*.vtu.tgz", "geo_LHC*_AoA_*/volume_*.vtu.tgz"]
  full_command: |
    hf download nvidia/HiLiftAeroML \
      --type dataset \
      --local-dir ./hiliftaeroml_data \
      --dry-run
  download_note: "The complete repository occupies approximately 66.9 TB on Hugging Face. The native-point surface-quadrature files occupy approximately 1.02 TB; --dry-run reports the size of any selected subset."
  known_issues:
    - "For 1,768 volume cases, omit the 1,232,817 published all-zero PointData rows identified by the repository's (case_id, raw_point_id) metadata."
    - "For the six corrected force/moment cases, the monitor-derived uncertainty columns and convergence plots were not recomputed and do not quantify uncertainty in the substituted surface-integrated means."
  citation: |
    @article{ashton2026hiliftaeroml,
      title={HiLiftAeroML: High-Fidelity Computational Fluid Dynamics Dataset for High-Lift Aircraft Aerodynamics},
      author={Ashton, Neil and Clark, Adam and Heidt, Liam and Ivey, Christopher and Bose, Sanjeeb and Agrawal, Rahul and Goc, Konrad and Ranade, Rishi and Adams, Corey and Sharpe, Peter and Nidhan, Sheel and Akkurt, Semit and Leibovici, Daniel and Kossaifi, Jean},
      journal={arXiv preprint arXiv:2605.19565},
      year={2026},
      url={https://arxiv.org/abs/2605.19565}
    }
  contributors:
    - "Created by collaborators from NVIDIA, Cadence Design Systems and The Boeing Company"
    - "Computing support from Cadence, NVIDIA, TACC, CSCS and Oak Ridge Leadership Computing Facility"
