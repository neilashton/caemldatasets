    - name: Geometry
      details: "Vehicle surfaces, geometry parameters and reference values"
      formats: "STL · CSV"
    - name: CAD geometry
      details: "CAD definitions for all 484 public runs, with coordinates in millimetres"
      formats: STEP
    - name: Surface fields
      details: "Time-averaged boundary quantities"
      formats: VTP
    - name: Surface quadrature
      details: "Polygon areas aligned with the native boundary CellData order"
      formats: NPY
    - name: Volume fields
      details: "Three-dimensional solution split into large-file parts on the Hub"
      formats: VTU
    - name: Integrated data
      details: "Force and moment coefficients using variable and constant references"
      formats: CSV
    - name: Reproduction assets
      details: "Slices, images and OpenFOAM meshes"
      formats: "VTP · PNG · OpenFOAM"
    - name: Official benchmark splits
      details: "Deterministic case lists, split-construction metrics, scripts and methodology"
      formats: "JSON · CSV · Python · PDF"
  surface_quadrature:
    title: "Native boundary polygon areas"
    summary: "Each sidecar contains one little-endian float32 area in square metres per native boundary polygon, aligned with the polygon ID and CellData tuple order of the corresponding raw VTP."
    association: "CellData · native polygons"
    coverage: "484/484 public cases"
    units: "m²"
    payload_size: "16.64 GB"
    filename_pattern: "run_N/boundary_cell_area_N.npy"
    compatibility_note: "Each array is valid only for its exact raw boundary_N.vtp. It must not be reused after polygon reordering, resampling or retriangulation; the 16 non-public run IDs have no public sidecars."
    files_url: https://huggingface.co/datasets/neashton/drivaerml/tree/main/surface_cell_areas
    manifest_url: https://huggingface.co/datasets/neashton/drivaerml/resolve/main/surface_cell_areas/manifest.json
  official_splits:
    release_date: "2026-08-17"
    summary: "Eight deterministic split regimes are provided for standard benchmarking, data-efficiency studies and out-of-distribution evaluation. The committed JSON manifest is the source of truth for case membership."
    public_cases: 484
    unavailable_cases: 16
    coverage_note: "The 16 unavailable or author-held-back run IDs are excluded from every partition."
    provenance_note: "The full split uses the seed-42 public baseline."
    manifest_url: https://huggingface.co/datasets/neashton/drivaerml/resolve/main/splits/manifest.json
    manifest_size: "54.9 kB"
