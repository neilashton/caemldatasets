    files_description: "Manifest, construction metrics, generation scripts, figures and methodology for the official WindsorML splits on Hugging Face."
    documentation_url: https://huggingface.co/datasets/neashton/windsorml/resolve/main/splits/README.pdf
    documentation_size: "1.0 MB"
    regimes:
