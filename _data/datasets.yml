  arxiv_id: "2605.19565"
  published: "2026-05-20"
  modified: "2026-08-07"
  formats: [VTU, NPY, STL, STEP, CSV, PNG, JSON]
  keywords: [computational fluid dynamics, machine learning, aircraft aerodynamics, high lift, CRM-HL, WMLES, scientific machine learning]
  overview: |
    HiLiftAeroML comprises 1,800 simulations: 180 variants of the NASA Common Research Model in high-lift configuration, each evaluated at ten angles of attack from 4° to 22°. The dataset supports surrogate modelling of complex three-dimensional aircraft flows.

    The simulations use GPU-accelerated explicit wall-modelled LES on solution-adapted grids containing 300–500 million cells. In addition to geometry, surface and volume fields and integrated coefficients, the repository provides deterministic training, validation and test splits and native-surface quadrature weights for reproducible, area-weighted evaluation.
  intended_uses:
    - Surrogate modelling of complete aircraft in high-lift configuration.
    - Evaluation of interpolation and out-of-distribution generalisation.
    - Assessment on unseen geometries, angles of attack, deflections and stall conditions.
    - Area-weighted evaluation of native-surface predictions.
  outputs:
    - name: Geometry
      details: "Tessellated and CAD definitions for each aircraft variant"
      formats: "STL · STEP"
    - name: Surface fields
      details: "Compressed time-averaged boundary data and dual-area weights"
      formats: "VTU.TGZ · NPY"
    - name: Volume fields
      details: "Compressed three-dimensional time-averaged solution"
      formats: VTU.TGZ
    - name: Integrated data
      details: "Forces, moments, geometry values and flow reference values"
      formats: CSV
    - name: Evaluation assets
      details: "Deterministic split families, manifests, validation records and plots"
      formats: "JSON · CSV · PNG"
  download_groups:
    - id: summary
      label: Summary and splits
      description: "All-case tables plus deterministic train/validation/test definitions."
      default: true
      patterns: [force_mom_all.csv, geo_values_all.csv, "splits/**"]
    - id: metadata
      label: Per-case metadata
      description: "Force, geometry and reference CSV files."
      default: true
      patterns: ["geo_LHC*_AoA_*/force_mom_*.csv", "geo_LHC*_AoA_*/geo_values_*.csv", "geo_LHC*_AoA_*/ref_values_*.csv"]
    - id: geometry
      label: Geometry
      description: "Per-case STL and STEP geometry."
      default: false
      patterns: ["geo_LHC*_AoA_*/*.stl", "geo_LHC*_AoA_*/*.stp"]
    - id: images
      label: Images and plots
      description: "Wall-shear-stress renders and coefficient histories."
      default: false
      patterns: ["geo_LHC*_AoA_*/*.png"]
    - id: quadrature
      label: Surface quadrature
      description: "Native-point dual-area weights and their provenance."
      default: false
      patterns: ["geo_LHC*_AoA_*/boundary_dual_area_*.npy", "surface_dual_areas/**"]
    - id: fields
      label: Surface and volume fields
      description: "The largest compressed CFD archives."
      default: false
      patterns: ["geo_LHC*_AoA_*/boundary_*.vtu.tgz", "geo_LHC*_AoA_*/volume_*.vtu.tgz"]
  full_command: |
    hf download nvidia/HiLiftAeroML \
      --type dataset \
      --local-dir ./hiliftaeroml_data \
      --dry-run
  download_note: "The complete repository occupies approximately 66.9 TB on Hugging Face. The native-point surface-quadrature files occupy approximately 1.02 TB; --dry-run reports the size of any selected subset."
