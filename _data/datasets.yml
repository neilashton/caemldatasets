- key: ahmedml
  name: AhmedML
  short_name: AhmedML
  permalink: /ahmedml/
  seo_title: "AhmedML official benchmark splits"
  description: "AhmedML provides 500 parametric Ahmed-body CFD cases and official train, validation and test splits for data-efficiency and out-of-distribution evaluation."
  eyebrow: "Automotive · bluff-body aerodynamics"
  tagline: "500 Ahmed-body geometries with time-averaged CFD outputs and deterministic benchmark splits."
  image: /assets/img/ahmed_body.png
  image_alt: "Ahmed body diagram showing the separated vortical structures represented in AhmedML"
  domain: Automotive
  geometry: Ahmed body
  cases: "500 geometries"
  case_count: 500
  flow_regime: "Low-speed, incompressible"
  method: "Hybrid RANS–LES"
  solver: "OpenFOAM v2212"
  resolution: "About 20 million cells per case"
  size: "About 3.1 TB"
  license: "CC BY-SA 4.0"
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  repository: neashton/ahmedml
  huggingface_url: https://huggingface.co/datasets/neashton/ahmedml
  paper_url: https://arxiv.org/abs/2407.20801
  paper_title: "AhmedML: High-Fidelity Computational Fluid Dynamics Dataset for Incompressible, Low-Speed Bluff Body Aerodynamics"
  arxiv_id: "2407.20801"
  doi: "10.57967/hf/5002"
  published: "2024-07-30"
  modified: "2026-08-18"
  formats: [VTP, VTU, NPY, STL, CSV, JSON, PNG]
  keywords:
    [
      computational fluid dynamics,
      machine learning,
      Ahmed body,
      automotive aerodynamics,
      hybrid RANS-LES,
      OpenFOAM,
      benchmark splits,
      out-of-distribution evaluation,
      surface quadrature,
      area-weighted evaluation,
    ]
  overview: |
    AhmedML comprises 500 parametrically varied Ahmed-body geometries simulated using a time-accurate hybrid RANS–LES workflow. The simplified geometry represents pressure-induced separation and three-dimensional vortical structures without the geometric complexity of a complete road vehicle.

    Each case includes geometry, time-averaged surface and volume fields, force and moment coefficients, sampled slices and rendered images. Mesh-native polygon-area arrays are supplied alongside every boundary VTP for physically area-weighted surface metrics. The repository also contains the OpenFOAM setup and validation cases. These products support surrogate modelling, geometric learning, reduced-order modelling and reproducibility studies.

    Official deterministic train, validation and test splits are provided for a random baseline, nested data-efficiency studies, geometry extrapolation, drag-regime extrapolation and image-derived wake-structure evaluation.
  intended_uses:
    - Surrogate modelling of surface fields, volume fields or integrated coefficients.
    - Analysis of geometric effects on separated bluff-body flow.
    - Evaluation of mesh-, point-cloud- and graph-based learning methods.
    - Area-weighted evaluation of predictions on the native boundary polygons.
    - Reproduction or extension of the published OpenFOAM workflow.
  outputs:
    - name: Geometry
      details: "Parametric values, STL surfaces and the SolveSpace definition"
      formats: "CSV · STL · SLVS"
    - name: Surface fields
      details: "Time-averaged boundary flow quantities"
      formats: VTP
    - name: Surface quadrature
      details: "Polygon areas aligned with the native boundary CellData order"
      formats: NPY
    - name: Volume fields
      details: "Three-dimensional time-averaged flow solution"
      formats: VTU
    - name: Integrated data
      details: "Drag and lift coefficients with constant and varying reference areas"
      formats: CSV
    - name: Derived views
      details: "Flow slices and rendered field images"
      formats: "VTP · PNG"
    - name: Official benchmark splits
      details: "Deterministic case lists, split-construction metrics, scripts and methodology"
      formats: "JSON · CSV · Python · PDF"
  surface_quadrature:
    title: "Native boundary polygon areas"
    summary: "Each sidecar contains one little-endian float32 area in square metres per native boundary polygon, aligned with the polygon ID and CellData tuple order of the corresponding raw VTP."
    association: "CellData · native polygons"
    coverage: "500/500 cases"
    units: "m²"
    payload_size: "2.14 GB"
    filename_pattern: "run_N/boundary_cell_area_N.npy"
    compatibility_note: "Each array is valid only for its exact raw boundary_N.vtp. It must not be reused after polygon reordering, resampling or retriangulation."
    files_url: https://huggingface.co/datasets/neashton/ahmedml/tree/main/surface_cell_areas
    manifest_url: https://huggingface.co/datasets/neashton/ahmedml/resolve/main/surface_cell_areas/manifest.json
  official_splits:
    release_date: "2026-08-17"
    summary: "Eight deterministic split regimes are provided for standard benchmarking, data-efficiency studies and out-of-distribution evaluation. The committed JSON manifest is the source of truth for case membership."
    public_cases: 500
    unavailable_cases: 0
    coverage_note: "All 500 documented run IDs are represented in each complete benchmark split."
    provenance_note: "The full split uses the seed-42 public baseline."
    manifest_url: https://huggingface.co/datasets/neashton/ahmedml/resolve/main/splits/manifest.json
    manifest_size: "57.3 kB"
    manifest_sha256: "e7ea57437f4197dca9a9de67cad7d383aa3f7b7905771ac91522099a50f53c70"
    files_url: https://huggingface.co/datasets/neashton/ahmedml/tree/main/splits
    files_description: "Manifest, construction metrics, generation scripts, figures and methodology for the official AhmedML splits on Hugging Face."
    documentation_url: https://huggingface.co/datasets/neashton/ahmedml/resolve/main/splits/README.pdf
    documentation_size: "1.3 MB"
    reference_url: https://github.com/Emmi-AI/noether/blob/main/src/noether/data/datasets/cfd/caeml/ahmedml/split.py
    reference_label: "AhmedMLDefaultSplitIDs implementation in Noether"
    regimes:
      - name: full
        type: In-distribution
        train: 400
        val: 50
        test: 50
        purpose: "Seed-42 random baseline"
      - name: medium
        type: In-distribution
        train: 133
        val: 50
        test: 50
        purpose: "Data efficiency: one third of the full training set"
      - name: scarce
        type: In-distribution
        train: 67
        val: 50
        test: 50
        purpose: "Data efficiency: one sixth of the full training set"
      - name: super_scarce
        type: In-distribution
        train: 11
        val: 50
        test: 50
        purpose: "Extreme data-efficiency evaluation"
      - name: geometry
        type: Out-of-distribution
        train: 350
        val: 50
        test: 100
        purpose: "STL-surface Chamfer geometry extrapolation"
      - name: high_drag
        type: Out-of-distribution
        train: 350
        val: 50
        test: 100
        purpose: "High-drag coefficient extrapolation"
      - name: low_drag
        type: Out-of-distribution
        train: 350
        val: 50
        test: 100
        purpose: "Low-drag coefficient extrapolation"
      - name: image_wake
        type: Out-of-distribution
        train: 350
        val: 50
        test: 100
        purpose: "Image-derived wake-structure extrapolation"
    example: |
      import json
      from pathlib import Path

      manifest = json.loads(Path("manifest.json").read_text())
      train_ids = manifest["full_train"]
      val_ids = manifest["full_val"]
      test_ids = manifest["full_test"]
  download_groups:
    - id: summary
      label: Summary tables
      description: "Consolidated geometry and force/moment tables for all cases."
      default: true
      patterns: [force_mom_all.csv, force_mom_varref_all.csv, geo_parameters_all.csv]
    - id: splits
      label: Official splits
      description: "Deterministic manifests, methods, metrics, figures and generation code."
      default: true
      patterns: ["splits/**"]
    - id: geometry
      label: Geometry
      description: "Per-case STL geometry and parameter files."
      default: true
      patterns: ["run_*/ahmed_*.stl", "run_*/geo_parameters_*.csv"]
    - id: forces
      label: Forces and moments
      description: "Per-case aerodynamic coefficients."
      default: true
      patterns: ["run_*/force_mom_*.csv"]
    - id: images
      label: Images and slices
      description: "Rendered flow views and sampled planes."
      default: false
      patterns: ["run_*/images/**", "run_*/slices/**"]
    - id: surface
      label: Surface fields
      description: "Large per-case boundary files."
      default: false
      patterns: ["run_*/boundary_*.vtp"]
    - id: quadrature
      label: Surface quadrature
      description: "Native polygon areas and their reproducibility metadata."
      default: false
      patterns: ["run_*/boundary_cell_area_*.npy", "surface_cell_areas/**"]
    - id: reproduction
      label: Reproduction and validation
      description: "SolveSpace definition, OpenFOAM setup and four-mesh validation outputs."
      default: false
      patterns: [ahmedml.slvs, openfoam-casesetup.tgz, "validation/**"]
    - id: volume
      label: Volume fields
      description: "The largest per-case files; preview storage requirements first."
      default: false
      patterns: ["run_*/volume_*.vtu"]
  full_command: |
    hf download neashton/ahmedml \
      --type dataset \
      --local-dir ./ahmedml_data \
      --dry-run
  download_note: "The complete repository occupies approximately 3.1 TB on Hugging Face. The 500 native polygon-area sidecars total approximately 2.14 GB; the --dry-run output reports the size of a selected transfer before retrieval."
  known_issues:
    - "The per-run geometry parameter file is missing for run 500; use the consolidated geometry table where appropriate."
  citation: |
    @article{ashton2024ahmed,
      title={AhmedML: High-Fidelity Computational Fluid Dynamics Dataset for Incompressible, Low-Speed Bluff Body Aerodynamics},
      author={Ashton, Neil and Maddix, Danielle C. and Gundry, Samuel and Shabestari, Parisa M.},
      journal={arXiv preprint arXiv:2407.20801},
      year={2024},
      url={https://arxiv.org/abs/2407.20801}
    }
  contributors:
    - "CFD workflow and simulation: Neil Ashton"
    - "Geometry parameterisation: Samuel Gundry and Parisa Shabestari"
    - "Machine-learning dataset guidance: Danielle Maddix"

