    - name: Integrated data
      details: "Force and moment coefficients using variable and constant references"
      formats: CSV
    - name: Reproduction assets
      details: "Slices, images and OpenFOAM meshes"
      formats: "VTP · PNG · OpenFOAM"
    - name: Official benchmark splits
      details: "Deterministic case lists, split-construction metrics, scripts and methodology"
      formats: "JSON · CSV · Python · PDF"
