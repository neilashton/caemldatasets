    provenance_note: "The full split uses an approximately 80/10/10 seed-42 random partition. The WindsorML paper reports a preliminary 60/20/20 evaluation but does not publish exact case membership."
    manifest_url: https://huggingface.co/datasets/neashton/windsorml/resolve/main/splits/manifest.json
